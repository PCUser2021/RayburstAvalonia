name: Rayburst Windows x64 and ARM64 Inno Setup installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rayburst-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows ${{ matrix.label }} installer
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64
            target: x86_64-pc-windows-msvc
            output: x64
          - label: ARM64
            target: aarch64-pc-windows-msvc
            output: arm64

    steps:
      - name: Checkout packaging repository and pinned Rayburst submodule
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add ARM64 Rust target
        if: matrix.output == 'arm64'
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe was not found at $iscc" }

      - name: Build and package Rayburst
        shell: pwsh
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          OUTPUT_ARCH: ${{ matrix.output }}
          RAYBURST_VERSION: 4.1.0
        run: .\scripts\Build-Rayburst.ps1

      - name: Upload Inno Setup installer
        uses: actions/upload-artifact@v4
        with:
          name: Rayburst-4.1.0-Windows-${{ matrix.output }}
          path: artifacts/installer/Rayburst-4.1.0-Setup-${{ matrix.output }}.exe
          if-no-files-found: error
          retention-days: 30
