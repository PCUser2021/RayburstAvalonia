name: Windows x64 and ARM64 installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x64
            rid: win-x64
            engine_asset: windows-x86_64
            setup_arch: x64compatible
            asset: x64
          - label: ARM64
            rid: win-arm64
            engine_asset: windows-arm64
            setup_arch: arm64
            asset: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        shell: pwsh
        run: dotnet restore src/RayburstReach/RayburstReach.csproj -r ${{ matrix.rid }}

      - name: Publish self-contained app
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { '0.1.0' }
          New-Item -ItemType Directory -Force -Path artifacts/publish, artifacts/installer | Out-Null
          dotnet publish src/RayburstReach/RayburstReach.csproj --configuration Release --runtime '${{ matrix.rid }}' --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -p:Version=$version --output artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Download and verify pinned Aria2 Next engine and license
        shell: pwsh
        run: |
          $version = (Get-Content engine/aria2-next.version -Raw).Trim()
          $assetName = "aria2-next-$version-${{ matrix.engine_asset }}.exe"
          $checksumName = "aria2-next-$version-checksums.sha256"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/AnInsomniacy/aria2-next/releases/tags/v$version" -Headers @{ 'User-Agent' = 'RayburstAvalonia-CI' }
          $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          $checksums = $release.assets | Where-Object { $_.name -eq $checksumName } | Select-Object -First 1
          if (-not $asset -or -not $checksums) { throw "Required engine asset or checksum manifest missing from Aria2 Next v$version." }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "artifacts/publish/aria2-next.exe"
          Invoke-WebRequest -Uri $checksums.browser_download_url -OutFile "artifacts/aria2-next-checksums.sha256"
          $line = Get-Content "artifacts/aria2-next-checksums.sha256" | Where-Object { $_ -match [regex]::Escape($assetName) } | Select-Object -First 1
          if (-not $line -or $line -notmatch '^\s*([a-fA-F0-9]{64})') { throw "Could not parse SHA-256 for $assetName." }
          $expected = $Matches[1].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 "artifacts/publish/aria2-next.exe").Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Aria2 Next checksum mismatch. Expected $expected; received $actual." }
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/AnInsomniacy/aria2-next/v$version/COPYING" -OutFile "artifacts/publish/COPYING-Aria2-Next.txt"
          "Verified Aria2 Next v$version (${{ matrix.engine_asset }}): $actual" | Write-Host

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }

      - name: Compile installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { '0.1.0' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" /DMyAppArchitecture=${{ matrix.setup_arch }} /DMyAppOutputName=${{ matrix.asset }} "installer/RayburstReach.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "artifacts/installer/RayburstReach-Setup-${{ matrix.asset }}.exe")) { throw "Installer was not created." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.asset }}
          path: artifacts/installer/RayburstReach-Setup-${{ matrix.asset }}.exe
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]'))
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 manifest
        run: cd release-assets && sha256sum RayburstReach-Setup-*.exe > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          target_commitish: ${{ github.sha }}
          name: Rayburst Avalonia ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          body: |
            Windows x64 and native ARM64 installers for Rayburst Avalonia.

            - `RayburstReach-Setup-x64.exe`: Intel/AMD x64 Windows; also supports Windows 11 ARM64 emulation.
            - `RayburstReach-Setup-arm64.exe`: native Windows ARM64.

            The release workflow validates the bundled Aria2 Next engine against the upstream SHA-256 manifest and includes the engine's GPL-2.0 license file.
            This is an early independent .NET/Avalonia port and is not yet feature-equivalent to upstream Rayburst.
          files: |
            release-assets/RayburstReach-Setup-x64.exe
            release-assets/RayburstReach-Setup-arm64.exe
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
